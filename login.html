<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login | PRO ANTIBAN</title>
<style>
:root{--bg-0:#050a18;--cyan-400:#38bdf8;--err:#f87171;--ok:#34d399}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{background:radial-gradient(ellipse at top,#0a1e3d,#050a18);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{position:relative;background:rgba(15,25,50,.72);border:1px solid rgba(56,189,248,.5);border-radius:18px;padding:34px 30px;width:100%;max-width:400px;backdrop-filter:blur(20px);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(56,189,248,.08) inset}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px}
.brand .logo{width:60px;height:60px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#38bdf8,#3b82f6);font-weight:800;font-size:26px;color:#04121f;box-shadow:0 8px 30px rgba(56,189,248,.45)}
.brand h1{font-size:20px;letter-spacing:1.5px;font-weight:800;text-transform:uppercase}
.brand p{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#7dd3fc;opacity:.8}
.field{margin-bottom:16px}
label{display:block;font-size:12px;margin-bottom:8px;letter-spacing:.5px;color:#9ec9e8;text-transform:uppercase}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid rgba(56,189,248,.3);background:rgba(5,10,24,.65);color:#fff;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--cyan-400);box-shadow:0 0 0 3px rgba(56,189,248,.18)}
.btn{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#38bdf8,#3b82f6);color:#fff;font-weight:700;font-size:15px;letter-spacing:.5px;cursor:pointer;margin-top:8px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.6;cursor:default}
.msg{text-align:center;font-size:13px;margin-top:14px;min-height:18px;color:var(--err)}
.msg.ok{color:var(--ok)}
/* Honeypot: hidden from humans, tempting to bots */
.hp{position:absolute;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">P</div>
    <h1>PRO ANTIBAN</h1>
    <p>Control Room</p>
  </div>

  <form id="login-form" onsubmit="return false;">
    <div class="field"><label>Username</label><input id="username" type="text" autocomplete="username"></div>
    <div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password"></div>
    <!-- Honeypot: bots fill this, humans never see it -->
    <div class="hp" aria-hidden="true">
      <label>Website</label>
      <input id="website" type="text" tabindex="-1" autocomplete="off">
    </div>
    <button class="btn" id="login-btn" onclick="login()">Login</button>
    <div class="msg" id="msg"></div>
  </form>
</div>
<script>
async function login(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();
  const hp=document.getElementById('website').value;
  const msg=document.getElementById('msg');
  if(!u||!p){msg.className='msg';msg.textContent='Username and password required';return}
  const btn=document.getElementById('login-btn');
  btn.disabled=true;msg.className='msg';msg.textContent='';
  const fd=new FormData();
  fd.append('username',u);fd.append('password',p);fd.append('website',hp);
  try{
    const r=await fetch('/login',{method:'POST',body:fd});
    const d=await r.json();
    if(d.status==='ok'){msg.className='msg ok';msg.textContent='Welcome back...';location.href=d.redirect||'/';return}
    msg.className='msg';msg.textContent=d.error||'Login failed';
    btn.disabled=false;
  }catch(e){msg.className='msg';msg.textContent='Connection error';btn.disabled=false}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')login()})
</script>
</body>
</html>
